[project]
name = "oblivion-buddy"
version = "0.1.0"
description = "Oblivion SMP's Discord bot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aio-mc-rcon>=3.4.1",
    "discord-py>=2.6.4",
    "easy-pil>=0.4.0",
    "mcstatus>=12.0.6",
    "pillow>=10.1.0,<11.0.0",
    "pynacl>=1.6.1",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "google-genai>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "B006", "B904"]
ignore = ["E501"]  # Lange linjer er OK (mye norsk tekst og embeds)
